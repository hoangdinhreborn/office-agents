services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      APP_NAME: deskhive-harness
      DATABASE_URL: sqlite:///./data/assistant.db
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      LLM_LOOPBACK_HOST: host.docker.internal
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
